<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Faculty Publication System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard" class="app-page">
<div class="app-layout">
  <aside class="app-sidebar">
    <div>
      <p class="eyebrow mb-1">FPS</p>
      <h3>Faculty Portal</h3>
      <p class="small text-muted mb-4">Publication Governance Suite</p>
      <a class="nav-link active" href="dashboard.html">Dashboard</a>
      <a class="nav-link" href="new-report.html">Add Publication</a>
    </div>
    <a class="nav-link logout" href="#" id="logoutLink">Sign Out</a>
  </aside>

  <main class="app-main">
    <header class="page-header">
      <div>
        <p class="eyebrow mb-2">Overview</p>
        <h1>Welcome, <span id="facultyDisplayName">Faculty</span></h1>
      </div>
      <div class="timestamp" id="liveDate"></div>
    </header>

    <section class="metrics-grid">
      <article class="metric-card">
        <p>Total Publications</p>
        <h2 id="totalPublications">0</h2>
      </article>
      <article class="metric-card">
        <p>Journal Articles</p>
        <h2 id="journalCount">0</h2>
      </article>
      <article class="metric-card">
        <p>Conference Papers</p>
        <h2 id="conferenceCount">0</h2>
      </article>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h4 class="mb-0">Publication Records</h4>
        <div class="d-flex gap-2 w-100 justify-content-end flex-wrap">
          <select id="typeFilter" class="form-select search-box">
            <option value="All">All Types</option>
            <option value="International Conference">International Conference</option>
            <option value="National Conference">National Conference</option>
            <option value="Journal">Journal</option>
            <option value="Article">Article</option>
          </select>
          <input id="searchInput" class="form-control search-box" placeholder="Search by title, venue, author">
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr>
              <th>Publication</th>
              <th>Type</th>
              <th>Scope</th>
              <th>Indexing</th>
              <th>Venue</th>
              <th>Date</th>
              <th>DOI</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="publicationTableBody"></tbody>
        </table>
      </div>
      <p id="emptyState" class="text-muted py-3 px-2 mb-0 d-none">No publication records found.</p>
    </section>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
