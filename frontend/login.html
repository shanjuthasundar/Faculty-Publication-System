<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faculty Access | FPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login" class="auth-page">
<div class="auth-background"></div>
<main class="auth-shell">
  <section class="brand-panel">
    <p class="eyebrow">Faculty Publication System</p>
    <h1>Research output, governance-ready and institution-grade.</h1>
    <p>Track journals and conference papers with verified records and clean reporting views.</p>
  </section>

  <section class="auth-card">
    <h2>Faculty Sign In</h2>
    <p class="text-muted mb-4">Use your faculty account. New email IDs will be provisioned on first login.</p>
    <form id="loginForm">
      <label class="form-label" for="facultyName">Faculty Name (required for first login)</label>
      <input id="facultyName" type="text" class="form-control form-control-lg mb-3" placeholder="Dr. Jane Doe">

      <label class="form-label" for="facultyEmail">Faculty Email</label>
      <input id="facultyEmail" type="email" class="form-control form-control-lg mb-3" placeholder="faculty@university.edu" required>

      <label class="form-label" for="facultyPassword">Password</label>
      <input id="facultyPassword" type="password" class="form-control form-control-lg mb-4" placeholder="Enter password" required>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="recoverPassword">
        <label class="form-check-label small text-muted" for="recoverPassword">
          Forgot password? Enter faculty name + email + new password, then enable reset
        </label>
      </div>

      <button id="loginButton" class="btn btn-primary btn-lg w-100 rounded-pill">Access Dashboard</button>
      <p id="loginError" class="text-danger mt-3 mb-0 d-none"></p>
    </form>
  </section>
</main>
<script src="js/app.js"></script>
</body>
</html>
