<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Author Access | FPS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body data-page="login" class="auth-page">
<div class="auth-background"></div>
<main class="auth-shell">
  <section class="brand-panel">
    <p class="eyebrow">Faculty Publication System</p>
    <h1>Research output, governance-ready and institution-grade.</h1>
    <p>Track journals and conference papers with verified records and clean reporting views.</p>
  </section>

  <section class="auth-card">
    <h2 id="authTitle">Author Sign In</h2>
    <p id="authSubtitle" class="text-muted mb-4">Use your BITS institutional account only (@bitsathy.ac.in).</p>
    <form id="loginForm">
      <label class="form-label" for="authorName">Author Name (required for first login)</label>
      <input id="authorName" type="text" class="form-control form-control-lg mb-3" placeholder="Dr. Jane Doe">

      <label class="form-label" for="authorEmail">Author Email</label>
      <input id="authorEmail" type="email" class="form-control form-control-lg mb-3" placeholder="yourname@bitsathy.ac.in" required>

      <label class="form-label" for="authorPassword">Password</label>
      <input id="authorPassword" type="password" class="form-control form-control-lg mb-3" placeholder="Enter password" required>

      <div class="d-flex justify-content-start align-items-center mb-3">
        <button id="createAccountBtn" type="button" class="btn btn-link p-0 small text-decoration-none">
          Don't have an account? Create new one
        </button>
      </div>

      <button id="loginButton" class="btn btn-primary btn-lg w-100 rounded-pill">Access Dashboard</button>
      <p id="loginError" class="text-danger mt-3 mb-0 d-none"></p>
    </form>
  </section>
</main>
<script type="module" src="js/app.js"></script>
</body>
</html>
